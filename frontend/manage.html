<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>Kickvana · Manage the real match</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070D">
<link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/brand/theme.css"><script src="/static/brand/push.js"></script>
<style>
body{padding:0}.in{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px 60px}
.hd{display:flex;align-items:center;gap:10px}.sp{flex:1}.back{background:#ffffff0d;border:1px solid #ffffff1a;color:#cfd8f5;border-radius:12px;padding:8px 12px;font:500 13px Inter;text-decoration:none}
h2{font:700 26px "Space Grotesk";margin:12px 0 2px}.mut{color:#8592B0;font-size:12px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.sb{border-radius:20px;padding:16px;text-align:center;border:1px solid #2DE2FF44;background:linear-gradient(160deg,#2DE2FF14,#05070D)}
.sb.alt{border-color:#FF3DCB66;background:linear-gradient(160deg,#8B5CF622,#FF3DCB14)}.sb .k{font:700 11px Inter;letter-spacing:.2em;color:#2DE2FF}.sb.alt .k{color:#FF3DCB}
.sb .s{font:700 52px/1.1 "Space Grotesk";font-variant-numeric:tabular-nums}.sb .t{font-size:12px;color:#cfd8f5}
.min{text-align:center;font:700 15px "Space Grotesk";color:#00F5A0}
.c{background:linear-gradient(180deg,#0F1830cc,#0A1020cc);border:1px solid #1C2742;border-radius:18px;padding:14px;margin-top:12px}.c h3{font:700 15px "Space Grotesk";margin:0 0 8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.g{grid-template-columns:1fr}}
.pl{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #ffffff08;font-size:13px}.pl span.n{flex:1}.grp{font:700 10px Inter;padding:3px 6px;border-radius:6px;background:#ffffff10}
.bar{width:60px;height:7px;border-radius:5px;background:#ffffff12;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00F5A0,#2DE2FF)}
button.b,a.b{border:0;border-radius:999px;padding:11px 16px;font:700 12px Inter;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:#05070D;background:#00F5A0;text-decoration:none;display:inline-block}
button.b.alt,a.b.alt{color:#fff;background:linear-gradient(135deg,#8B5CF6,#FF3DCB)}button.b.gh,a.b.gh{color:#cfd8f5;background:#ffffff0d;border:1px solid #ffffff1c}button.sm{padding:6px 10px;font-size:10px}
select{background:#ffffff0a;color:#fff;border:1px solid #ffffff1c;border-radius:10px;padding:8px;font:13px Inter;width:100%}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tg label{font:600 11px Inter;color:#8592B0}
.ev{font-size:12px;padding:4px 0;border-bottom:1px solid #ffffff08}.ev.goal{color:#00F5A0;font-weight:700}.ev.tactic{color:#c6b4ff}.ev.sub{color:#2DE2FF}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.fin{text-align:center;border-color:#FF3DCB88}.fin h2{background:linear-gradient(90deg,#fff,#FF3DCB);-webkit-background-clip:text;color:transparent;font-size:32px}
.modal{position:fixed;inset:0;z-index:50;background:#05070Dcc;display:none;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}.sheet{width:100%;max-width:520px;max-height:85vh;overflow:auto;background:#0A1020;border:1px solid #2A3A5E;border-radius:20px;padding:16px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:#0F1830;border:1px solid #2A3A5E;border-radius:14px;padding:10px 16px;font-size:13px;display:none}
img.card{width:100%;border-radius:14px;border:1px solid #1C2742;margin:10px 0}
</style></head><body><div class="toast" id="toast"></div><div class="in">
<div class="hd"><a class="back" id="back" href="/">‹ Match centre</a><span class="sp"></span><img src="/static/brand/mark.svg" height="26" alt=""></div>
<div id="app"><p class="mut" style="margin-top:30px">Loading the real match…</p></div></div>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div class="sheet" id="sheet"></div></div>
<script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),FID=+q.get('fixture');let SID=q.get('t')||localStorage['kv_shadow_'+FID]||'',D=null,CLOCK=null,PLAY=null,POLL=null;
const T=localStorage.tl_token,H={'content-type':'application/json',...(T?{Authorization:'Bearer '+T}:{})};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3000)}
async function api(u,o={}){const r=await fetch(u,{...o,headers:H,body:o.body?JSON.stringify(o.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok){toast(typeof d.detail==='string'?d.detail:'Something went wrong');throw new Error(d.detail)}return d}
$('back').href='/match/'+FID;
async function boot(){if(SID){try{D=await api(`/api/shadow/${SID}`+(CLOCK!=null?`?clock=${CLOCK}`:''));if(D.fixture_id!==FID)throw 0;if(D.replay&&CLOCK==null)CLOCK=D.final?90:D.branch_minute;if(D.replay&&!D.final)D=await api(`/api/shadow/${SID}?clock=${CLOCK}`);return draw()}catch(e){SID=''}}
 const f=await api('/api/fixtures/'+FID).catch(()=>null);const h=f?.live?.home?.name||'Home',a=f?.live?.away?.name||'Away';
 $('app').innerHTML=`<h2>Manage the real match</h2><p class="mut">Pick the side you're managing. Your timeline starts from the real state of the game, then runs alongside the real match: every change you make only affects your version.</p>
 <div class="row" style="margin:14px 0"><button class="b" onclick="start('home')">Manage ${esc(h||'home')}</button><button class="b alt" onclick="start('away')">Manage ${esc(a||'away')}</button></div>
 <label class="mut">Replays only: start from minute <input id="bm" type="number" min="0" max="85" value="0" style="width:70px;background:#ffffff0a;color:#fff;border:1px solid #ffffff1c;border-radius:8px;padding:6px"></label>`}
async function start(side){const m=+($('bm')||{}).value||0;D=await api('/api/shadow',{method:'POST',body:{fixture_id:FID,side,minute:m||null}});SID=D.id;localStorage['kv_shadow_'+FID]=SID;history.replaceState(0,'',`?fixture=${FID}&t=${SID}`);CLOCK=D.replay?D.minute:null;draw()}
function draw(){const d=D,r=d.real,you=d.you,i=d.side==='home'?0:1;const opp=d.side==='home'?r.away:r.home;
 const ft=d.final;const sideName=d.side==='home'?r.home:r.away;
 $('app').innerHTML=`<h2>${esc(r.home)} v ${esc(r.away)}</h2><p class="mut">You manage <b style="color:#fff">${esc(sideName)}</b> from ${d.branch_minute}'. ${d.replay?'Replay mode: the real match is over, your clock runs on its own.':'Live: your timeline follows the real clock and refreshes every 30 seconds.'} ${d.seed_info&&JSON.stringify(d.seed_info).includes('official')?'Using the confirmed XIs.':'Using the modelled XI (line-ups not confirmed).'}</p>
 <div class="min">${d.minute}'${d.real.ended&&!d.replay?' · FT':''}</div>
 <div class="duo"><div class="sb"><div class="k">REAL MATCH</div><div class="s">${r.score_now[0]}–${r.score_now[1]}</div><div class="t">${esc(r.home)} v ${esc(r.away)}</div></div>
 <div class="sb alt"><div class="k">YOUR TIMELINE</div><div class="s">${d.alt.score[0]}–${d.alt.score[1]}</div><div class="t">${you.formation} · ${(d.alt.events.filter(e=>e.type==='sub').length)}/5 subs</div></div></div>
 ${ft?`<div class="c fin"><div class="mut">FULL-TIME COMPARISON</div><h2>${esc(ft.headline.split(' (')[0])}</h2><p>Reality: ${esc(ft.team)} ${ft.real_result} ${ft.real[0]}–${ft.real[1]} · Your timeline: ${ft.alt_result} ${ft.alt[0]}–${ft.alt[1]}</p><div id="shareBox"><button class="b alt" onclick="share()">Create share card</button></div></div>`:''}
 ${d.replay&&!ft?`<div class="row" style="justify-content:center;margin:8px 0"><button class="b" onclick="togglePlay()">${PLAY?'Pause':'Play'}</button><button class="b gh" onclick="jump(Math.min(90,CLOCK+15))">+15 min</button><button class="b gh" onclick="jump(90)">To full time</button></div>`:''}
 <div class="g"><div class="c"><h3>On the pitch</h3>${you.starters.map(p=>`<div class="pl"><span class="grp">${p.group}</span><span class="n">${esc(p.name)}</span><div class="bar"><i style="width:${Math.round(p.energy*100)}%"></i></div>${ft?'':`<button class="b gh sm" onclick="subPick('${p.id}')">Sub</button>`}</div>`).join('')}</div>
 <div><div class="c"><h3>Tactics</h3>${ft?'<p class="mut">Match over.</p>':`<div class="tg">${['formation','pressing','defensive_line','tempo','width','build_up'].map(k=>`<label>${k.replace('_',' ')}<select id="t_${k}">${(k==='formation'?d.formations:d.options[k]).map(o=>`<option ${you.tactics[k]===o?'selected':''}>${o}</option>`).join('')}</select></label>`).join('')}</div><button class="b" style="margin-top:10px" onclick="applyTac()">Send to the touchline</button>`}</div>
 <div class="c"><h3>Timelines</h3><div class="g" style="gap:8px"><div><div class="mut" style="color:#2DE2FF">REAL</div>${r.goals.filter(g=>g.minute<=d.minute).map(g=>`<div class="ev goal">${g.minute}' ${esc(g.side==='home'?r.home:r.away)}${g.player?' · '+esc(g.player):''}</div>`).join('')||'<div class="mut">No goals yet</div>'}</div>
 <div><div class="mut" style="color:#FF3DCB">YOURS</div>${d.alt.events.map(e=>`<div class="ev ${e.type}">${e.minute}' ${esc(e.side===d.side?'':'['+opp+'] ')}${esc(e.text)}</div>`).join('')||'<div class="mut">No changes yet</div>'}</div></div></div></div></div>
 <p class="mut" style="margin-top:12px">${esc(d.label)}</p>`;
 clearInterval(POLL);if(!d.replay&&!ft)POLL=setInterval(refresh,30000)}
async function refresh(){D=await api(`/api/shadow/${SID}`);draw()}
async function jump(m){CLOCK=m;D=await api(`/api/shadow/${SID}?clock=${CLOCK}`);draw();if(D.final){clearInterval(PLAY);PLAY=null}}
function togglePlay(){if(PLAY){clearInterval(PLAY);PLAY=null;draw();return}PLAY=setInterval(()=>{if(CLOCK>=90){clearInterval(PLAY);PLAY=null;return}jump(Math.min(90,CLOCK+3))},900);draw()}
async function change(body){if(D.replay)body.minute=CLOCK;D=await api(`/api/shadow/${SID}/change`,{method:'POST',body});if(D.replay)D=await api(`/api/shadow/${SID}?clock=${CLOCK}`);draw();toast('Change made in your timeline')}
function applyTac(){const t={};['formation','pressing','defensive_line','tempo','width','build_up'].forEach(k=>{const v=$('t_'+k).value;if(v!==D.you.tactics[k])t[k]=v});if(!Object.keys(t).length)return toast('Nothing changed');change({tactics:t})}
function subPick(out){$('sheet').innerHTML=`<h3>Bring on…</h3>${D.you.bench.map(b=>`<div class="pl"><span class="grp">${b.group}</span><span class="n">${esc(b.name)}</span><button class="b sm" onclick="$('modal').classList.remove('on');change({sub:{out_id:'${out}',in_id:'${b.id}'}})">On</button></div>`).join('')||'<p class="mut">No one left on the bench.</p>'}`;$('modal').classList.add('on')}
async function share(){const c=await api(`/api/share/shadow/${SID}`,{method:'POST'});
 $('shareBox').innerHTML=`<img class="card" src="${c.image.replace(location.origin,'')}" alt="share card"><div class="row" style="justify-content:center"><button class="b" id="ws">Share</button><a class="b gh" target="_blank" rel="noopener" href="${c.x_intent}">X</a><a class="b gh" target="_blank" rel="noopener" href="${c.whatsapp}">WhatsApp</a><button class="b gh" onclick="navigator.clipboard.writeText('${c.url}');toast('Link copied')">Copy link</button></div>`;
 $('ws').onclick=()=>KVShare(c).then(r=>{if(r){navigator.clipboard.writeText(c.url);toast('Link copied')}})}
boot();
</script></body></html>
