<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>Kickvana · Match Centre</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070D">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/brand/theme.css"><script src="/static/brand/push.js"></script>
<style>
:root{--h:#00F5A0;--a:#FF7A59}
*{-webkit-tap-highlight-color:transparent}body{padding:0;overflow-x:hidden}
.in{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 30px)}
.hd{display:flex;align-items:center;gap:10px}.hd img{height:26px}.sp{flex:1}
.back{background:#ffffff0d;border:1px solid #ffffff1a;color:#cfd8f5;border-radius:12px;padding:8px 12px;font:500 13px Inter;text-decoration:none}
.sb{margin:14px 0 10px;padding:16px;border-radius:22px;background:linear-gradient(160deg,#ffffff10,#ffffff04);border:1px solid #ffffff17;backdrop-filter:blur(18px);position:relative;overflow:hidden}
.sb:before{content:"";position:absolute;inset:-40% auto auto -20%;width:240px;height:240px;border-radius:50%;background:#00F5A0;opacity:.09;filter:blur(50px)}
.sb:after{content:"";position:absolute;inset:auto -20% -50% auto;width:240px;height:240px;border-radius:50%;background:#FF7A59;opacity:.09;filter:blur(50px)}
.lg{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7c87ab;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.tm{flex:1;text-align:center;font-weight:600;font-size:13px}.tm img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto 6px}
.sc{font:700 40px/1 "Space Grotesk";letter-spacing:.04em;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.sc.bump{animation:bump .8s}@keyframes bump{30%{transform:scale(1.25);color:#00F5A0;text-shadow:0 0 30px #00F5A0}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:#ffffff10;margin:10px auto 0}
.pill.live{background:#FF3B5C22;color:#FF8FA2}.pill.live i{width:7px;height:7px;border-radius:50%;background:#FF3B5C;box-shadow:0 0 10px #FF3B5C;animation:pulse 1.4s infinite}
.pill.ft{background:#2DE2FF1c;color:#2DE2FF}.pill.up{background:#00F5A01a;color:#00F5A0}
@keyframes pulse{50%{opacity:.3}}
.ctr{text-align:center}.cd{font:600 30px "Space Grotesk";color:#2DE2FF;font-variant-numeric:tabular-nums;margin-top:8px}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto;scrollbar-width:none}.tabs button{flex:1;min-width:70px;padding:10px 8px;border-radius:14px;border:1px solid #ffffff17;background:#ffffff08;color:#aeb8d6;font:600 12px Inter;letter-spacing:.06em}
.tabs button.on{background:#00F5A016;border-color:#00F5A0;color:#fff;box-shadow:0 8px 26px -14px #00F5A0}
.pane{display:none;animation:fade .35s}.pane.on{display:block}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid #00F5A030;background:#06140f;box-shadow:0 30px 70px -40px #00F5A0}
canvas{display:block;width:100%}
.flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font:800 46px "Space Grotesk";letter-spacing:.12em;opacity:0}
.flash.on{animation:fl 2.2s}@keyframes fl{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.flash small{display:block;font:600 13px Inter;letter-spacing:.2em;text-align:center}
.hud{position:absolute;left:10px;top:8px;font:600 12px "Space Grotesk";color:#dfe;background:#05070Daa;padding:4px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
.dir{position:absolute;right:10px;top:8px;font-size:10px;color:#9fb;background:#05070Daa;padding:4px 8px;border-radius:8px}
.ctl{display:flex;align-items:center;gap:8px;margin:10px 0}.ctl button{width:42px;height:42px;border-radius:50%;border:0;background:#00F5A0;color:#05070D;font:700 16px Inter;box-shadow:0 8px 24px -10px #00F5A0}
.ctl select{background:#ffffff0d;color:#cfd8f5;border:1px solid #ffffff1a;border-radius:10px;padding:8px}
.scrub{position:relative;flex:1;height:30px}.scrub input{width:100%;margin:8px 0 0;accent-color:#00F5A0}
.mk{position:absolute;top:0;width:3px;height:9px;border-radius:2px;transform:translateX(-50%)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{padding:7px 11px;border-radius:999px;border:1px solid #ffffff1c;background:#ffffff08;color:#aeb8d6;font:600 11px Inter;letter-spacing:.05em}
.chip.on{border-color:#2DE2FF;color:#fff;background:#2DE2FF18}
.mini{margin-top:10px;padding:12px;border-radius:16px;background:#ffffff06;border:1px solid #ffffff12}.mini h4{margin:0 0 6px;font:600 11px Inter;letter-spacing:.18em;text-transform:uppercase;color:#7c87ab}
.ev{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff0f;animation:fade .4s}.ev b{font:700 13px "Space Grotesk";min-width:38px;color:#2DE2FF}.ev .ic{font-size:16px}
.ev.r{flex-direction:row-reverse;text-align:right}
.st{margin:10px 0}.st .l{display:flex;justify-content:space-between;font-size:12px;color:#cfd8f5}.bar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:#ffffff10;margin-top:4px}.bar i{display:block;background:var(--h)}.bar u{display:block;background:var(--a);margin-left:auto}
.btn{display:block;text-align:center;border:0;border-radius:999px;padding:15px;font:700 13px Inter;letter-spacing:.18em;text-transform:uppercase;color:#05070D;background:#00F5A0;text-decoration:none;box-shadow:0 10px 36px -10px #00F5A0aa;margin-top:12px}
.btn.alt{background:linear-gradient(135deg,#8B5CF6,#FF3DCB);color:#fff;box-shadow:0 10px 36px -10px #FF3DCBaa}.btn.ghost{background:#ffffff0d;color:#cfd8f5;box-shadow:none;border:1px solid #ffffff1a}
.note{font-size:11px;color:#6B7699;margin-top:8px;line-height:1.5}.warn{font-size:12px;color:#FFB547;background:#FFB54714;border:1px solid #FFB54733;padding:8px 10px;border-radius:12px;margin-top:8px}
.rc h3{font:700 24px "Space Grotesk";margin:6px 0}.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cmp>div{padding:12px;border-radius:14px}
.real{background:#2DE2FF10;border:1px solid #2DE2FF33}.alt{background:linear-gradient(160deg,#8B5CF61c,#FF3DCB14);border:1px solid #FF3DCB33}
.xi{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px}.xi div div{padding:3px 0;color:#cfd8f5}
.skel{height:220px;border-radius:18px;background:linear-gradient(90deg,#ffffff06,#ffffff12,#ffffff06);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style><script src="/static/brand/a11y.js" defer></script></head><body><div class="in">
<div class="hd"><a class="back" href="/#modes">‹ Matches</a><span class="sp"></span><img src="/static/brand/mark.svg" alt=""></div>
<div class="sb"><div class="lg" id="lg">Loading…</div>
<div class="row"><div class="tm"><img id="hl" alt=""><span id="hn">Home</span></div><div class="sc" id="sc">–</div><div class="tm"><img id="al" alt=""><span id="an">Away</span></div></div>
<div class="ctr"><span class="pill" id="pill">…</span><div class="cd" id="cd" hidden></div><div class="note" id="upd"></div></div></div>
<div id="warn"></div>
<div class="tabs" id="tabs"><button data-p="pitch" class="on">2D Pitch</button><button data-p="centre">Centre</button><button data-p="recap" id="tRecap">Recap</button><button data-p="lineups">Line-ups</button></div>

<section class="pane on" id="pitch">
<div class="stage" id="stage"><canvas id="cv"></canvas><div class="hud" id="hud">0'</div><div class="dir" id="dir"></div><div class="flash" id="flash"></div></div>
<div class="ctl"><button id="play">❚❚</button><div class="scrub"><div id="marks"></div><input type="range" id="scr" min="0" max="5400" value="0" step="1"></div>
<select id="spd"><option value="12">12×</option><option value="30" selected>30×</option><option value="90">90×</option></select></div>
<div class="chips" id="ov"><span class="chip on" data-o="trails">Ball trail</span><span class="chip" data-o="network">Passing network</span><span class="chip" data-o="heat">Heat map</span><span class="chip" data-o="shots">Shot map</span><span class="chip" data-o="cam">Camera follow</span></div>
<div class="mini"><h4>Momentum · pressure</h4><canvas id="mom" height="70"></canvas></div>
<div class="mini"><h4>xG timeline <span id="xgv" style="float:right;color:#cfd8f5;letter-spacing:0"></span></h4><canvas id="xgc" height="80"></canvas></div>
<p class="note" id="lbl"></p>
</section>

<section class="pane" id="centre"><div class="mini"><h4>Live ticker</h4><div id="tick"></div></div><div class="mini"><h4>Team stats</h4><div id="stats"></div></div></section>
<section class="pane" id="recap"><div id="rc" class="rc"></div></section>
<section class="pane" id="lineups"><div class="mini"><div id="xi" class="xi"></div><p class="note" id="xinote"></p></div></section>
<div id="cta"></div>
</div>
<script>
const $=id=>document.getElementById(id),FID=+location.pathname.split('/').pop();
let S=null,T=null,simT=0,playing=true,last=0,camX=50,camY=50,camZ=1,bx=50,by=50,trail=[],firedIdx=0,OV={trails:1};
const H='#00F5A0',A='#FF7A59';
const ICON={Goal:'⚽',Card:'🟨',subst:'🔁',Var:'📺'};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));if(b.dataset.p==='pitch')resize()});
document.querySelectorAll('#ov .chip').forEach(c=>c.onclick=()=>{c.classList.toggle('on');OV[c.dataset.o]=c.classList.contains('on')});
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'❚❚':'▶'};
$('scr').oninput=e=>{simT=+e.target.value;firedIdx=T?T.events.filter(x=>x.t<simT).length:0;trail=[]};
const mm=t=>{const m=Math.floor(t/60);return m>90?`90+${m-90}'`:m+"'"};
function fmtCd(s){if(s<=0)return 'Kick-off';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;return (d?d+'d ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
// ---------- snapshot ----------
let koAt=0,prevScore='';
function render(s){S=s;const L=s.live,st=s.state;
 $('lg').textContent=`${L.league} · ${L.round||''}`;$('hn').textContent=L.home.name;$('an').textContent=L.away.name;$('hl').src=L.home.logo;$('al').src=L.away.logo;
 const sc=st.phase==='upcoming'||st.phase==='prematch'?'vs':`${L.score.home??'–'} – ${L.score.away??'–'}`;
 if(prevScore&&prevScore!==sc){$('sc').classList.remove('bump');void $('sc').offsetWidth;$('sc').classList.add('bump')}prevScore=sc;$('sc').textContent=sc;
 const p=$('pill');p.className='pill';koAt=Date.now()+st.seconds_to_ko*1000;$('cd').hidden=true;
 if(st.phase==='live'){p.classList.add('live');p.innerHTML=`<i></i>Live · ${L.status.elapsed??0}'${L.status.extra?'+'+L.status.extra:''}`}
 else if(st.phase==='halftime'){p.classList.add('live');p.innerHTML='<i></i>Half-time'}
 else if(st.ended){p.classList.add('ft');p.textContent=st.label}
 else if(st.phase==='postponed'){p.textContent='Postponed'}
 else{p.classList.add('up');p.textContent=st.label;$('cd').hidden=false}
 $('upd').textContent=`Checked ${new Date(s.fetched_at*1000).toLocaleTimeString('en-GB',{timeZone:'Europe/London'})} UK · next refresh ${new Date(s.next_refresh*1000).toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'})} · KO ${new Date(L.kickoff_utc).toLocaleString('en-GB',{timeZone:'Europe/London',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} UK`;
 $('warn').innerHTML=(s.feed_warning?`<div class="warn">${s.feed_warning}</div>`:'')+(st.phase==='stale_finished'?`<div class="warn">This match has finished but the feed hasn't confirmed the result. Live play is closed; replay and What-if are open.</div>`:'');
 // ticker
 const ev=[...L.events].reverse();$('tick').innerHTML=ev.length?ev.map(e=>{const home=e.team_id===L.home.id;const ic=e.type==='Card'?(e.detail&&e.detail.includes('Red')?'🟥':'🟨'):ICON[e.type]||'•';return `<div class="ev ${home?'':'r'}"><b>${e.minute}'${e.extra?'+'+e.extra:''}</b><span class="ic">${ic}</span><span><span style="color:${home?H:A}">${e.player||''}</span>${e.assist?` <span class="note">(${e.type==='subst'?'⇄ ':''}${e.assist})</span>`:''}<br><span class="note">${e.detail||''}</span></span></div>`}).join(''):`<p class="note">${st.ended?'No events recorded by the feed.':'No events yet. The ticker fills in as the match happens and updates itself.'}</p>`;
 // stats
 const sb=L.statistics.by_team,h=sb[L.home.id],a=sb[L.away.id];
 $('stats').innerHTML=h&&a?Object.keys(h).filter(k=>h[k]!=null||a[k]!=null).map(k=>{const n=v=>parseFloat(String(v??0))||0,x=n(h[k]),y=n(a[k]),t=x+y||1;return `<div class="st"><div class="l"><span>${h[k]??0}</span><span class="note" style="margin:0">${k.replace(/_/g,' ')}</span><span>${a[k]??0}</span></div><div class="bar"><i style="width:${x/t*100}%"></i><u style="width:${y/t*100}%"></u></div></div>`}).join(''):`<p class="note">${L.statistics.note}</p>`;
 // lineups
 const lu=L.lineups,lw=s.lineup_watch||{};$('xi').innerHTML=lu.available?`<div style="grid-column:1/-1"><b>✅ Confirmed XI</b>${lw.source?` <span class="note">via ${lw.source}</span>`:''}</div>`+[L.home,L.away].map((t,i)=>{const x=lu.by_team[t.id];return `<div><b style="color:${i?A:H}">${t.name}</b> <span class="note">${x?x.formation||'':''}${x&&x.coach?' · '+x.coach:''}</span>${x?x.startXI.map(p=>`<div>${p.number??''} ${p.name} <span class="note">${p.pos||''}</span></div>`).join('')+`<div class="note" style="margin-top:6px">Bench: ${(x.substitutes||[]).map(p=>p.name).join(', ')||'n/a'}</div>`:'<div class="note">Not announced</div>'}</div>`}).join(''):`<div style="grid-column:1/-1" class="note"><b>⏳ ${lw.label||'Line-ups expected ~1h before kick-off'}</b>${lw.watch_starts_utc?`<br>Kickvana starts checking at ${new Date(lw.watch_starts_utc).toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'})} UK and every 5 min after.`:''}${lw.checks?`<br>Checked ${lw.checks}× so far.`:''}${lw.plan_note?`<br>${lw.plan_note}`:''}</div>`;
 $('xinote').textContent=lu.available?'The 2D view, simulations and What-if branches use these confirmed XIs.':'Until confirmed, the 2D view and simulations use an XI modelled from the squad.';
 // recap
 $('tRecap').style.display=st.ended?'':'none';if(st.ended)renderRecap(s);
 // CTAs from state machine
 const q=`fixture=${FID}`;let c='';
 if(st.playable_live&&st.phase!=='prematch')c=`<a class="btn" href="/live/manage?${q}">Manage it live vs reality</a><a class="btn ghost" href="/live/play?${q}">Simulate from now</a>`;
 else if(st.phase==='prematch'||st.phase==='upcoming')c=`<a class="btn" href="/?fixture=${FID}#setup">Set up your match</a><a class="btn ghost" href="/fantasy?fixture=${FID}">Pick a fantasy team</a>`;
 if(st.ended)c=`<a class="btn alt" href="/live/manage?${q}">Replay it as manager vs reality</a><a class="btn ghost" href="/live/play?${q}&mode=whatif">What if… odds from any minute</a><a class="btn ghost" href="/fantasy?fixture=${FID}">Fantasy points</a>`;
 if(!st.ended)c+=`<button class="btn ghost" id="bell" onclick="bell()">🔔 Alerts for this match</button>`;$('cta').innerHTML=c;
 loadTimeline()}
function renderRecap(s){const r=s.recap,L=s.live;if(!r)return;const alt=JSON.parse(localStorage['tl_alt_'+FID]||'null');
 $('rc').innerHTML=`<div class="mini"><h4>Full-time recap</h4><h3>${r.headline}</h3>${r.star?`<p>Star man: <b style="color:#00F5A0">${r.star}</b></p>`:''}
 <h4 style="margin-top:14px">Key moments</h4>${r.key_moments.length?r.key_moments.map(e=>`<div class="ev"><b>${e.minute}'</b><span class="ic">${e.type==='Goal'?'⚽':'🟥'}</span><span style="color:${e.side==='home'?H:A}">${e.player||''}</span><span class="note">${e.detail}</span></div>`).join(''):'<p class="note">None recorded.</p>'}</div>
 <div class="mini"><h4>Reality vs your alternate timeline</h4><div class="cmp"><div class="real"><span class="note">REAL</span><h3>${r.score[0]??'?'}–${r.score[1]??'?'}</h3><span class="note">${r.confirmed?'confirmed':'awaiting feed'}</span></div>
 <div class="alt"><span class="note">YOUR TIMELINE</span>${alt?`<h3>${Math.round(alt.win*100)}% win</h3><span class="note">${alt.side_name} · from ${alt.minute}' · draw ${Math.round(alt.draw*100)}%</span>`:`<h3>—</h3><span class="note">You haven't rewritten this one yet.</span>`}</div></div></div>`}
// ---------- timeline + 2D ----------
let tlKey='';
async function loadTimeline(){const st=S.state;const key=S.fetched_at+'';if(key===tlKey)return;tlKey=key;
 if(st.phase==='upcoming'||st.phase==='prematch'||st.phase==='postponed'||(st.phase==='stale_finished'&&!S.live.events.length)){T=null;buildIdle();if(st.phase==='stale_finished')$('lbl').textContent='The feed never confirmed what happened in this match, so we won\'t invent a replay. Rewrite it in What-if mode instead.';return}
 const r=await fetch(`/api/centre/${FID}/timeline`);T=await r.json();const end=T.end_minute*60;$('scr').max=end;
 if(st.phase==='live'||st.phase==='halftime'){simT=Math.max(0,end-240);} // join near live edge
 $('marks').innerHTML=T.events.filter(e=>e.type==='Goal'||e.type==='Card').map(e=>`<span class="mk" style="left:${e.t/end*100}%;background:${e.type==='Goal'?'#fff':'#FFD23F'}"></span>`).join('');
 $('lbl').textContent=T.label+(T.stats_source==='real'?'':' (No match stats in the feed, so possession and shot volume are estimated.)');firedIdx=T.events.filter(e=>e.t<simT).length;precompute()}
function buildIdle(){$('lbl').textContent='Pre-match: the two sides warm up in their expected shapes. The 2D match starts at kick-off and updates itself.';
 T={idle:true,teams:{home:{slots:shape('4-2-3-1'),players:[]},away:{slots:shape('4-2-3-1'),players:[]}},possessions:[],events:[],end_minute:0};
 const lu=S.live.lineups.by_team;['home','away'].forEach(sd=>{const x=lu[S.live[sd].id];if(x){T.teams[sd].slots=shape(x.formation);T.teams[sd].players=x.startXI.map(p=>p.name)}});precompute()}
function shape(f){const l=(f||'4-2-3-1').split('-').map(Number),p=[[5,50]],n=l.length;l.forEach((k,i)=>{const x=n>1?20+i*60/(n-1):50;for(let j=0;j<k;j++)p.push([x,(j+1)*100/(k+1)])});return p.slice(0,11)}
let PRE=null;
function precompute(){if(!T)return;const net={home:{},away:{}},shots=[],xg={home:[[0,0]],away:[[0,0]]},mom=new Array(Math.max(1,Math.ceil(T.end_minute))+1).fill(0);let cx={home:0,away:0};
 for(const p of T.possessions){p.passes.forEach(([i,j])=>{const k=i+'-'+j;net[p.side][k]=(net[p.side][k]||0)+1});const m=Math.floor(p.t0/60);if(m<mom.length)mom[m]+=(p.side==='home'?1:-1)*(p.passes.length+(p.shot?4:0));
  if(p.shot){shots.push({...p.shot,side:p.side,t:p.t1});cx[p.side]+=p.shot.xg;xg[p.side].push([p.t1,cx[p.side]])}}
 PRE={net,shots,xg,mom}}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function curPoss(t){if(!T||!T.possessions.length)return null;let lo=0,hi=T.possessions.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(T.possessions[m].t0<=t)lo=m;else hi=m-1}return T.possessions[lo]}
function teamPos(side,ballX,ballY,inPoss,t){const sl=T.teams[side].slots;const fx=side==='home'?ballX:100-ballX,fy=side==='home'?ballY:100-ballY;
 const push=inPoss?(fx-45)*.42+6:(fx-55)*.34-4;
 return sl.map(([x,y],i)=>{let X=i===0?Math.min(16,x+push*.12):x+push*(0.6+x/150),Y=y+(fy-y)*(inPoss?.12:.22)+Math.sin(t/7+i*1.7)*1.2;X+=Math.cos(t/9+i)*0.8;X=Math.max(2,Math.min(98,X));
  return side==='home'?[X,Y]:[100-X,100-Y]})}
function ballAt(t){const p=curPoss(t);if(!p)return{x:50,y:50,side:null,p:null};
