<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>Kickvana · Account</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070D"><meta name="description" content="Manage your Kickvana account">
<link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/brand/theme.css"><script src="/static/brand/a11y.js" defer></script>
<style>.doc{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px 80px}.doc h1{font-size:clamp(28px,6vw,40px);margin:18px 0 4px}.doc h2{font-size:18px;margin:28px 0 6px;text-transform:none;letter-spacing:0;color:var(--txt)}
.doc p,.doc li{color:#c9d3ee;font-size:15px;line-height:1.65}.top{display:flex;gap:10px;align-items:center}.top a.home{color:var(--txt);text-decoration:none;font:700 18px "Space Grotesk"}.sp{flex:1}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--mut)}.foot a{margin-right:14px}
input{background:#0A1020;border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:11px 12px;font:15px Inter;width:100%;max-width:380px}label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}.ok{color:var(--volt)}.err{color:#ff8fa3}</style></head>
<body><a class="skip" href="#main">Skip to content</a><main class="doc" id="main"><div class="top"><a class="home" href="/" aria-label="Kickvana home"><img src="/static/brand/mark.svg" alt="" width="26" height="26" style="vertical-align:-6px"> Kickvana</a><span class="sp"></span><a href="/support">Help</a></div>
<h1 id="ttl">Account</h1><div id="v" aria-live="polite"></div><div class="foot"><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/support">Support</a><a href="/account">Account</a><br>Kickvana is an independent game. Not affiliated with any league, club or data provider. No gambling, no loot boxes.</div></main><script>
const $=id=>document.getElementById(id),T=()=>localStorage.tl_token,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=new URLSearchParams(location.search),TOK=P.get('token');
async function call(u,o={}){const r=await fetch(u,{...o,headers:{'content-type':'application/json',...(T()?{Authorization:'Bearer '+T()}:{}),...(o.headers||{})},body:o.body?JSON.stringify(o.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Something went wrong');return d}
const msg=(t,ok)=>`<p class="${ok?'ok':'err'}" role="status">${esc(t)}</p>`;
async function verify(){$('ttl').textContent='Verify email';try{await call('/api/auth/verify',{method:'POST',body:{token:TOK}});$('v').innerHTML=msg('Email verified. Thanks!',1)+'<p><a href="/account">Go to your account</a></p>'}catch(e){$('v').innerHTML=msg(e.message)}}
function reset(){$('ttl').textContent='Reset password';
 if(TOK){$('v').innerHTML=`<form id="f" class="box"><label for="pw">New password (8+ characters)</label><input id="pw" type="password" minlength="8" required autocomplete="new-password"><p><button>Set new password</button></p><div id="o"></div></form>`;
  $('f').onsubmit=async e=>{e.preventDefault();try{await call('/api/auth/reset',{method:'POST',body:{token:TOK,password:$('pw').value}});$('o').innerHTML=msg('Password changed. Sign in with your new password.',1)+'<p><a href="/account">Sign in</a></p>'}catch(x){$('o').innerHTML=msg(x.message)}}}
 else{$('v').innerHTML=`<form id="f" class="box"><label for="em">Account email</label><input id="em" type="email" required autocomplete="email"><p><button>Email me a reset link</button></p><div id="o"></div></form>`;
  $('f').onsubmit=async e=>{e.preventDefault();try{const r=await call('/api/auth/forgot',{method:'POST',body:{email:$('em').value}});$('o').innerHTML=msg(r.message,1)}catch(x){$('o').innerHTML=msg(x.message)}}}}
function signin(){ $('v').innerHTML=`<form id="f" class="box"><label for="em">Email</label><input id="em" type="email" required autocomplete="email"><label for="pw">Password</label><input id="pw" type="password" minlength="8" required autocomplete="current-password">
 <label style="display:flex;gap:8px;align-items:flex-start;color:var(--txt)"><input id="age" type="checkbox" style="width:auto;margin-top:3px"> <span>I'm 13 or older and agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy policy</a> (needed to create an account)</span></label>
 <p style="display:flex;gap:8px;flex-wrap:wrap"><button type="submit" data-m="login">Sign in</button><button type="submit" data-m="register" class="ghost" style="background:#ffffff12;color:var(--txt)">Create account</button></p><p><a href="/account/reset">Forgot password?</a></p><div id="o"></div></form>`;
 let mode='login';$('f').querySelectorAll('button').forEach(b=>b.onclick=()=>mode=b.dataset.m);
 $('f').onsubmit=async e=>{e.preventDefault();try{if(mode==='register'&&!$('age').checked)throw new Error('Please confirm you are 13 or older to create an account.');
  const r=await call('/api/auth/'+mode,{method:'POST',body:{email:$('em').value,password:$('pw').value,...(mode==='register'?{age_ok:true}:{})}});localStorage.tl_token=r.token;main()}catch(x){$('o').innerHTML=msg(x.message)}}}
async function main(){if(!T())return signin();let a;try{a=await call('/api/account')}catch(e){localStorage.removeItem('tl_token');return signin()}
 $('v').innerHTML=`<div class="box"><p>Signed in as <b>${esc(a.email)}</b></p><p>Email: ${a.verified?'<span class="ok">verified ✓</span>':'<span class="err">not verified</span> <button id="rs">Resend link</button>'}</p><div id="o"></div></div>
 <div class="box"><h2 style="margin-top:0">Your data</h2><p>Download everything we store about you as a JSON file: account, careers, leagues, duels, challenges, achievements and alerts.</p><button id="ex">Download my data</button></div>
 <div class="box"><h2 style="margin-top:0">Password</h2><p><a href="/account/reset">Send me a reset link</a></p><button id="lo" style="background:#ffffff12;color:var(--txt)">Sign out</button></div>
 <div class="box" style="border-color:#FF4D6D66"><h2 style="margin-top:0">Delete account</h2><p>This permanently deletes your account and all game data. It can't be undone.</p><label for="cf">Type DELETE to confirm</label><input id="cf" autocomplete="off"><p><button id="del" style="background:var(--bad);color:#fff">Delete my account</button></p><div id="o2"></div></div>`;
 if($('rs'))$('rs').onclick=async()=>{try{const r=await call('/api/auth/verify/resend',{method:'POST'});$('o').innerHTML=msg(r.sent===false?'Verification email queued. Email delivery isn\'t switched on yet; contact support if it doesn\'t arrive.':'Verification email sent.',1)}catch(x){$('o').innerHTML=msg(x.message)}};
 $('ex').onclick=async()=>{const d=await call('/api/me/export');const u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='kickvana-data.json';l.click()};
 $('lo').onclick=async()=>{try{await call('/api/auth/logout',{method:'POST'})}catch(e){}localStorage.removeItem('tl_token');main()};
 $('del').onclick=async()=>{if($('cf').value.trim()!=='DELETE'){$('o2').innerHTML=msg('Type DELETE to confirm.');return}try{await call('/api/me',{method:'DELETE'});['tl_token','kv_career'].forEach(k=>localStorage.removeItem(k));$('v').innerHTML=msg('Your account and data have been deleted.',1)}catch(x){$('o2').innerHTML=msg(x.message)}}}
location.pathname==='/account/verify'?verify():location.pathname==='/account/reset'?reset():main();
</script></body></html>
