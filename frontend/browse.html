<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kickvana · Competitions</title><link rel="icon" href="/static/brand/favicon.svg"><link rel="stylesheet" href="/static/brand/theme.css">
<style>
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}.hd img{height:28px}.sp{flex:1}
a{color:inherit;text-decoration:none}
.glass{background:linear-gradient(160deg,#ffffff0d,#ffffff04);border:1px solid #ffffff14;border-radius:18px;backdrop-filter:blur(14px)}
.press{transition:transform .25s var(--ease),border-color .25s}.press:active{transform:scale(.97)}.press:hover{border-color:#00F5A055}
h1{font:600 28px "Space Grotesk",sans-serif;margin:6px 0 2px;letter-spacing:-.02em}.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.comp{padding:14px;display:flex;flex-direction:column;gap:8px;animation:up .5s var(--ease) both}.comp img{height:34px;width:34px;object-fit:contain;filter:drop-shadow(0 0 10px #2DE2FF33)}
.comp b{font:600 15px "Space Grotesk"}.comp span{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:6px;margin:10px 0 14px}.tab{padding:8px 14px;border-radius:999px;border:1px solid #ffffff1a;cursor:pointer;font-size:13px}
.tab.on{background:#00F5A0;color:#05070D;border-color:#00F5A0;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mut);font-weight:500;text-align:right;padding:6px 4px}th:nth-child(2){text-align:left}
td{padding:8px 4px;border-top:1px solid #ffffff0d;text-align:right}td:nth-child(2){text-align:left}td img{height:18px;width:18px;vertical-align:middle;margin-right:8px;object-fit:contain}
tr.el td:nth-child(2){color:#00F5A0}td.pts{font-weight:700;color:#fff}
.m{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px;animation:up .4s var(--ease) both}.m .t{flex:1;display:grid;gap:4px}.m img{height:18px;width:18px;object-fit:contain;vertical-align:middle;margin-right:6px}
.m .s{font:700 16px "Space Grotesk";min-width:54px;text-align:center}.k{color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:#2DE2FF1a;color:#2DE2FF}.tag.live{background:#FF4D6D22;color:#FF4D6D}.tag.ft{background:#ffffff10;color:var(--mut)}
.note{color:var(--mut);font-size:12px;margin-top:14px}.warn{padding:12px 14px;border-radius:14px;background:#FFB5471a;color:#FFB547;font-size:13px;margin-bottom:12px}
.thero{display:flex;gap:16px;align-items:center;padding:18px}.thero img{height:72px;width:72px;object-fit:contain;filter:drop-shadow(0 0 18px #00F5A044)}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}.pl div{padding:8px 10px;font-size:13px}.pl small{color:var(--mut);display:block}
.skel{height:120px;border-radius:18px;background:linear-gradient(90deg,#ffffff08,#ffffff12,#ffffff08);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}@keyframes up{from{opacity:0;transform:translateY(10px)}}
</style><script src="/static/brand/a11y.js" defer></script></head><body><div class="wrap">
<div class="hd"><a href="/" class="press"><img src="/static/brand/mark.svg" alt="Kickvana"></a><a href="/competitions" class="k press">Competitions</a><span class="sp"></span><a href="/" class="k press">‹ Home</a></div>
<div id="app"><div class="skel"></div></div></div>
<script>
const A=document.getElementById('app'),P=location.pathname.split('/').filter(Boolean);
const j=u=>fetch(u).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.detail||r.status);return d});
const when=x=>new Date(x.kickoff_utc).toLocaleString('en-GB',{timeZone:'Europe/London',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' UK';
const tag=s=>s.phase==='live'||s.phase==='halftime'?`<span class="tag live">● ${s.label}</span>`:s.ended?`<span class="tag ft">${s.label}</span>`:`<span class="tag">${s.label}</span>`;
const team=t=>`<a href="/team/${t.id}"><img src="${t.logo||''}" alt="" onerror="this.style.visibility='hidden'">${t.name}</a>`;
const match=(x,i)=>`<div class="m glass" style="animation-delay:${i*.03}s"><div class="t"><span class="k">${x.round||x.league} · ${when(x)}</span>${team(x.home)}${team(x.away)}</div><div class="s">${x.state.phase==='upcoming'||x.state.phase==='prematch'?'–':(x.score[0]??'')+'–'+(x.score[1]??'')}</div><div>${tag(x.state)}<br><a class="k" href="/match/${x.fixture_id}">${x.state.ended?'Replay · What if ›':'Match centre ›'}</a></div></div>`;
const err=e=>`<div class="warn">${e.message}</div>`;
async function comps(){const d=await j('/api/competitions');
 A.innerHTML=`<h1>Competitions</h1><p class="sub">Real tables and fixtures from the top flights and Europe. Tap one to dive in.</p>${d.paused?'<div class="warn">Live feed paused: no live data key is set yet.</div>':''}
 <div class="grid">${d.competitions.map((c,i)=>`<a class="comp glass press" href="/competitions/${c.code}" style="animation-delay:${i*.04}s"><img src="${c.emblem}" alt="" onerror="this.style.visibility='hidden'"><b>${c.name}</b><span>${c.area}</span></a>`).join('')}</div><p class="note">${d.not_covered}</p>`}
async function comp(code){A.innerHTML=`<h1 id="ct">${code}</h1><p class="sub" id="cs"></p><div class="tabs"><span class="tab on" data-t="table">Table</span><span class="tab" data-t="fx">Fixtures &amp; results</span></div><div id="body"><div class="skel"></div></div>`;
 const show=async t=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));const B=document.getElementById('body');B.innerHTML='<div class="skel"></div>';
  try{if(t==='table'){const d=await j(`/api/competitions/${code}/standings`);document.getElementById('ct').textContent=d.competition||code;document.getElementById('cs').textContent=d.matchday?`Matchday ${d.matchday}`:'';
    B.innerHTML=d.tables.length?d.tables.map(tb=>`${tb.group?`<div class="k" style="margin:14px 0 4px">${tb.group}</div>`:''}<div class="glass" style="padding:6px 10px;overflow-x:auto"><table><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${tb.rows.map(r=>`<tr class="${r.elite?'el':''}"><td>${r.pos}</td><td>${team(r.team)}</td><td>${r.played}</td><td>${r.won}</td><td>${r.draw}</td><td>${r.lost}</td><td>${r.gd>0?'+':''}${r.gd}</td><td class="pts">${r.pts}</td></tr>`).join('')}</table></div>`).join(''):'<p class="sub">No table for this competition (knockout format).</p>'}
   else{const d=await j(`/api/competitions/${code}/matches`);B.innerHTML=d.matches.length?d.matches.map(match).join(''):'<p class="sub">No matches in the next two weeks.</p>'}}catch(e){B.innerHTML=err(e)}};
 document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>show(x.dataset.t));show('table')}
async function teamPage(id){try{const d=await j('/api/teams/'+id),t=d.team;const G={Goalkeeper:'Goalkeepers',Defender:'Defenders',Midfielder:'Midfielders',Attacker:'Forwards'};
 A.innerHTML=`<div class="thero glass"><img src="${t.logo||''}" alt=""><div><h1>${t.name}</h1><p class="sub" style="margin:0">${[t.venue,t.coach&&'Coach: '+t.coach,t.founded&&'Founded '+t.founded].filter(Boolean).join(' · ')}</p><div style="margin-top:6px">${t.competitions.map(c=>`<a class="tag" href="/competitions/${c}">${c}</a>`).join(' ')}</div></div></div>
 <div class="k" style="margin:18px 0 8px">Fixtures &amp; results</div>${d.matches.map(match).join('')||'<p class="sub">No recent or upcoming matches.</p>'}
 <div class="k" style="margin:18px 0 8px">Squad</div>${Object.keys(G).map(g=>{const ps=d.squad.filter(p=>p.position===g);return ps.length?`<div class="k" style="margin:10px 0 4px;color:#2DE2FF">${G[g]}</div><div class="pl">${ps.map(p=>`<div class="glass">${p.name}<small>${p.age?p.age+' yrs':''}</small></div>`).join('')}</div>`:''}).join('')||'<p class="sub">Squad not listed.</p>'}
 <p class="note">${d.squad_note}</p>`}catch(e){A.innerHTML=err(e)}}
(P[0]==='team'?teamPage(P[1]):P[1]?comp(P[1].toUpperCase()):comps()).catch(e=>A.innerHTML=err(e));
</script></body></html>
